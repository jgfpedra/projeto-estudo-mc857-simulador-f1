resolver 127.0.0.11 valid=5s ipv6=off;
upstream f1_gateways {
    zone f1_gateways 64k;
    server gateway:8000 resolve max_fails=1 fail_timeout=2s;
    server gateway-alt:8000 resolve max_fails=1 fail_timeout=2s;
}
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location ~ ^/(races|circuits|seasons|tts)(/|$) {
        proxy_pass http://f1_gateways;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
    }
    location /ws/ {
        proxy_pass http://f1_gateways;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
