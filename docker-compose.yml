services:
  llama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      /bin/sh -c "
      ollama serve &
      sleep 3 &&
      ollama pull llama3.2 &&
      wait"

  backend:
    build: ./backend
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - llama

  ai:
    build: ./ai
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - llama

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  ollama_data:
